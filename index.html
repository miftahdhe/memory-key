<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Key</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="name-screen" class="screen active">
        <div class="lock-container">
            <h1 class="title">Memory Key</h1>
            <p class="subtitle">Siapa nama Anda?</p>
            
            <input type="text" id="name-input" class="name-input" placeholder="Masukkan nama Anda..." autocomplete="off">
            
            <div class="keypad" style="grid-template-columns: 1fr; margin-top: 10px;">
                <button class="key action confirm" style="width: 100%; border-radius: 12px; height: 50px; font-size: 14px;" onclick="submitName()">Lanjut</button>
            </div>
        </div>
    </div>

    <div id="lock-screen" class="screen">
        <div class="lock-container">
            <h1 class="title">Memory Key</h1>
            <p class="subtitle" id="lock-subtitle">Silakan masukkan akses</p>
            
            <div class="pin-display">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            
            <div class="message" id="error-message">Kode salah</div>
            
            <div class="keypad">
                <button class="key" onclick="pressKey('1')">1</button>
                <button class="key" onclick="pressKey('2')">2</button>
                <button class="key" onclick="pressKey('3')">3</button>
                <button class="key" onclick="pressKey('4')">4</button>
                <button class="key" onclick="pressKey('5')">5</button>
                <button class="key" onclick="pressKey('6')">6</button>
                <button class="key" onclick="pressKey('7')">7</button>
                <button class="key" onclick="pressKey('8')">8</button>
                <button class="key" onclick="pressKey('9')">9</button>
                <button class="key action" onclick="clearPin()">Del</button>
                <button class="key" onclick="pressKey('0')">0</button>
                <button class="key action confirm" onclick="submitPin()">OK</button>
            </div>
        </div>
    </div>

    <div id="welcome-screen" class="screen">
        <h2 class="welcome-text">Hai Hernes...</h2>
    </div>

    <div id="main-screen" class="screen">
        <div class="dashboard">
            <h2 class="dashboard-title">Memory Key</h2>
            <p class="dashboard-greeting">TO HERNES</p>
            <div class="dashboard-divider"></div>

            <div class="menu-container">
                <button class="menu-btn" onclick="openMenu('diary')">
                    <div class="menu-btn-content">
                        <span class="icon" style="margin-right: 12px;">✒️</span>
                        <span class="menu-btn-title">Diary</span>
                    </div>
                </button>
                <button class="menu-btn" onclick="openMenu('galeri')">
                    <div class="menu-btn-content">
                        <span class="icon" style="margin-right: 12px;">📸</span>
                        <span class="menu-btn-title">Galeri</span>
                    </div>
                </button>
                <button class="menu-btn" onclick="openMenu('catatan')">
                    <div class="menu-btn-content">
                        <span class="icon" style="margin-right: 12px;">📓</span>
                        <span class="menu-btn-title">Catatan</span>
                    </div>
                </button>
                <button class="menu-btn" onclick="openMenu('game')">
                    <div class="menu-btn-content">
                        <span class="icon" style="margin-right: 12px;">🎮</span>
                        <span class="menu-btn-title">Game</span>
                    </div>
                </button>
                <button class="menu-btn" onclick="openMenu('kapsul')">
                    <div class="menu-btn-content">
                        <span class="icon" style="margin-right: 12px;">⏳</span>
                        <span class="menu-btn-title">Kapsul Waktu</span>
                    </div>
                </button>
                <button class="menu-btn" onclick="openMenu('wishlist')">
                    <div class="menu-btn-content">
                        <span class="icon" style="margin-right: 12px;">📌</span>
                        <span class="menu-btn-title">Wishlist</span>
                    </div>
                </button>
                <button class="menu-btn" onclick="openMenu('mood')">
                    <div class="menu-btn-content">
                        <span class="icon" style="margin-right: 12px;">🎭</span>
                        <span class="menu-btn-title">Mood Tracker</span>
                    </div>
                </button>
                <button class="menu-btn" onclick="logoutApp()" style="background: rgba(211, 47, 47, 0.1); border-color: rgba(211, 47, 47, 0.3);">
                    <div class="menu-btn-content">
                        <span class="icon" style="margin-right: 12px;">🚪</span>
                        <span class="menu-btn-title" style="color: #d32f2f;">Keluar</span>
                    </div>
                </button>
            </div>
            <div class="footer">
                <span>Memory Key &copy; 2026 • v1.0.0</span>
                <span class="author-text">By : Miftah</span>
            </div>
        </div>
    </div>

    <!-- Background music for main menu -->
    <audio id="main-music" src="assets/halaman.mp3" loop></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "articulate-summer-58chg",
            appId: "1:865644935448:web:c18c46e5457616c7a5c66d",
            apiKey: "AIzaSyAwNe_iTf3a6cFmliiZaGrmLCnn-mBl-9c",
            authDomain: "articulate-summer-58chg.firebaseapp.com",
            storageBucket: "articulate-summer-58chg.firebasestorage.app",
            messagingSenderId: "865644935448"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app, "ai-studio-memorykey-6b6d5d2b-ef2b-407f-8d98-76d614ba8b9d");

        window.getUserPinFromDB = async function(username) {
            try {
                const q = query(collection(db, "user_pins"), where("username", "==", username.toLowerCase()));
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    return querySnapshot.docs[0].data().pinHash;
                }
            } catch(e) {
                console.error("Error getting user pin", e);
            }
            return null;
        };

        window.saveUserPinToDB = async function(username, pinHash, rawPin) {
            try {
                await addDoc(collection(db, "user_pins"), {
                    username: username.toLowerCase(),
                    pinHash: pinHash,
                    rawPin: rawPin,
                    timestamp: serverTimestamp()
                });
                return true;
            } catch(e) {
                console.error("Error saving user pin", e);
                return false;
            }
        };

        window.logVisitToFirebase = function(enteredName) {
            let deviceInfo = "Desktop";
            if (/Android/i.test(navigator.userAgent)) deviceInfo = "Android";
            else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) deviceInfo = "iOS";

            const visitData = {
                timestamp: serverTimestamp(),
                device: deviceInfo,
                userAgent: navigator.userAgent,
                enteredName: enteredName || "Unknown",
                location: null,
                locationStatus: 'not_requested'
            };

            const saveToDb = async (data) => {
                try {
                    await addDoc(collection(db, "visits"), data);
                } catch(e) {
                    console.error("Firebase error", e);
                }
            };

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        visitData.location = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        visitData.locationStatus = 'granted';
                        saveToDb(visitData);
                    },
                    (error) => {
                        visitData.locationStatus = 'denied';
                        saveToDb(visitData);
                    },
                    { timeout: 10000, enableHighAccuracy: true }
                );
            } else {
                visitData.locationStatus = 'unsupported';
                saveToDb(visitData);
            }
        };
    </script>
    <script src="script.js"></script>

</body>
</html>
