<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Key - Catatan</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 65vh;
            overflow-y: auto;
            padding: 0.5rem;
        }
        .note-item {
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.6);
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(136, 14, 79, 0.05);
            border-left: 3px solid var(--accent);
            line-height: 1.3;
        }
        .notes-list::-webkit-scrollbar {
            width: 6px;
        }
        .notes-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.2); 
            border-radius: 4px;
        }
        .notes-list::-webkit-scrollbar-thumb {
            background: var(--key-border); 
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="catatan-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fce4ec; z-index: 9999; display: flex; align-items: center; justify-content: center; color: #880e4f; font-family: 'Playfair Display', serif; font-size: 1.5rem; cursor: pointer;">
        Ketuk untuk membuka catatan
    </div>
    <div class="screen active">
        <div class="dashboard" style="max-width: 600px;">
            <button class="back-btn" onclick="window.history.back()">← Kembali</button>
            <h2 class="dashboard-title">Catatan</h2>
            <div class="dashboard-divider"></div>
            
            <div class="content-placeholder notes-list" id="notes-list">
                <!-- Notes will be loaded here dynamically -->
            </div>
        </div>
    </div>

    <!-- Audio element for catatan music -->
    <audio id="catatan-music" src="../assets/audio/catatan/catatan.mp3" loop></audio>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const notesList = document.getElementById('notes-list');
            for (let i = 1; i <= 5; i++) {
                try {
                    const response = await fetch(`../assets/catatan/catatan${i}.txt`);
                    if (response.ok) {
                        const text = await response.text();
                        const noteEl = document.createElement('p');
                        noteEl.className = 'note-item';
                        noteEl.textContent = text;
                        notesList.appendChild(noteEl);
                    }
                } catch (error) {
                    console.error('Error loading note', i, error);
                }
            }
        });

        document.getElementById('catatan-overlay').addEventListener('click', function() {
            const audio = document.getElementById('catatan-music');
            if(audio) {
                audio.volume = 0.5;
                audio.play();
            }
            this.style.display = 'none'; // hide overlay
        });
    </script>
</body>
</html>
