<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Key - Galeri</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="galeri.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="galeri-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fce4ec; z-index: 9999; display: flex; align-items: center; justify-content: center; color: #880e4f; font-family: 'Playfair Display', serif; font-size: 1.5rem; cursor: pointer;">
        Ketuk untuk membuka galeri
    </div>
    <div class="screen active">
        <div class="dashboard" style="max-width: 800px;">
            <button class="back-btn" onclick="window.history.back()">← Kembali</button>
            <h2 class="dashboard-title">Galeri</h2>
            <div class="dashboard-divider"></div>
            
            <div class="galeri-grid" id="galeri-grid"></div>
            <script>
                const grid = document.getElementById('galeri-grid');
                const galeriImages = Array.from({ length: 45 }, (_, i) => `memory_${i + 1}.jpg`);
                galeriImages.push('memory_47.jpg'); // Added specific image uploaded by user
                
                let htmlStr = '';
                galeriImages.forEach((img, i) => {
                    htmlStr += `
                    <div class="polaroid">
                        <img src="../assets/galeri/${img}" loading="lazy" alt="Memory ${i + 1}">
                        <div class="polaroid-caption">Memori ${i + 1}</div>
                    </div>`;
                });
                grid.innerHTML = htmlStr;
            </script>
        </div>
    </div>

    <!-- Lightbox Container -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lb-close">&times;</button>
        <button class="lightbox-prev" id="lb-prev">&#10094;</button>
        <img id="lb-img" src="" alt="Gallery Image Full">
        <button class="lightbox-next" id="lb-next">&#10095;</button>
        <div class="lightbox-caption" id="lb-caption"></div>
    </div>

    <!-- Audio element for gallery music -->
    <audio id="galeri-music" src="../assets/audio/galeri.mp3" loop></audio>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Audio logic
            const audio = document.getElementById('galeri-music');
            audio.volume = 0.5;

            // Lightbox logic
            const polaroids = document.querySelectorAll('.polaroid');
            const lightbox = document.getElementById('lightbox');
            const lbImg = document.getElementById('lb-img');
            const lbCaption = document.getElementById('lb-caption');
            const lbClose = document.getElementById('lb-close');
            const lbPrev = document.getElementById('lb-prev');
            const lbNext = document.getElementById('lb-next');

            let currentIndex = 0;
            const imagesData = [];

            // Extract images data
            polaroids.forEach((p, index) => {
                const img = p.querySelector('img');
                const caption = p.querySelector('.polaroid-caption').innerText;
                imagesData.push({ src: img.src, caption });

                p.addEventListener('click', () => {
                    openLightbox(index);
                });
            });

            function openLightbox(index) {
                currentIndex = index;
                updateLightboxContent();
                lightbox.classList.add('active');
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
            }

            function nextImage() {
                currentIndex = (currentIndex + 1) % imagesData.length;
                updateLightboxContent();
            }

            function prevImage() {
                currentIndex = (currentIndex - 1 + imagesData.length) % imagesData.length;
                updateLightboxContent();
            }

            function updateLightboxContent() {
                lbImg.style.opacity = 0; // fade out effect
                setTimeout(() => {
                    lbImg.src = imagesData[currentIndex].src;
                    lbCaption.innerText = imagesData[currentIndex].caption;
                    lbImg.style.opacity = 1; // fade in effect
                }, 150);
            }

            lbClose.addEventListener('click', closeLightbox);
            lbNext.addEventListener('click', nextImage);
            lbPrev.addEventListener('click', prevImage);

            // Close on clicking outside the image
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'Escape') closeLightbox();
            });

            // Swipe navigation for mobile
            let touchStartX = 0;
            let touchEndX = 0;

            lightbox.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            });

            lightbox.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });

            function handleSwipe() {
                const threshold = 50;
                if (touchStartX - touchEndX > threshold) {
                    nextImage(); // Swipe left
                }
                if (touchEndX - touchStartX > threshold) {
                    prevImage(); // Swipe right
                }
            }
        });
    </script>
    <script>
        document.getElementById('galeri-overlay').addEventListener('click', function() {
            const audio = document.getElementById('galeri-music');
            if(audio) {
                audio.volume = 0.5;
                audio.play();
            }
            this.style.display = 'none'; // hide overlay
        });
    </script>
</body>
</html>
