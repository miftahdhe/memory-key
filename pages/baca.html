<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Key - Baca</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="baca.css">
</head>
<body>
    <div id="loading-screen" class="screen active">
        <div class="loader"></div>
        <p>Menyiapkan ruang...</p>
    </div>

    <div id="book-screen" class="screen">
        <button class="back-btn absolute-back" onclick="window.location.href='diary.html'">← Kembali</button>
        
        <div class="scene-3d">
            <div class="table-surface">
                <div class="table-edge"></div>
            </div>
            
            <div class="book-container">
                <div class="book closed" id="the-book">
                    
                    <div class="page right-side">
                    <div class="page-face front right-page-bg">
                        <div class="page-content" id="right-text-container"></div>
                    </div>
                    <div class="page-face back cover-front">
                        <!-- Back cover of the book -->
                    </div>
                </div>

                <div class="page cover" id="cover-page">
                    <div class="page-face front cover-front">
                        <div class="cover-ornament">
                            <h2 class="book-title">Dalam Lima Waktuku</h2>
                        </div>
                    </div>
                    <div class="page-face back left-page-bg">
                        <div class="page-content" id="left-text-container"></div>
                    </div>
                </div>

            </div>
        </div>
        </div>

        <div class="pen" id="pen-cursor">✏️</div>
        <div class="hint-text" id="hint-text">Ketuk buku untuk membuka</div>
    </div>
    
    <audio id="bg-music" loop></audio>

    <script src="baca.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        
        const firebaseConfig = {
            projectId: "articulate-summer-58chg",
            appId: "1:865644935448:web:c18c46e5457616c7a5c66d",
            apiKey: "AIzaSyAwNe_iTf3a6cFmliiZaGrmLCnn-mBl-9c",
            authDomain: "articulate-summer-58chg.firebaseapp.com",
            storageBucket: "articulate-summer-58chg.firebasestorage.app",
            messagingSenderId: "865644935448"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app, "ai-studio-memorykey-6b6d5d2b-ef2b-407f-8d98-76d614ba8b9d");

        window.fetchDiaryFromDB = async function(dbId) {
            try {
                const docRef = doc(db, "user_diaries", dbId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    return docSnap.data();
                } else {
                    return null;
                }
            } catch (e) {
                console.error("Error getting document:", e);
                return null;
            }
        };
    </script>
</body>
</html>
